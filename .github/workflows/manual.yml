name: Debug Tests

on: [push]

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: FULL DEBUG INFO
      run: |
        echo "========== ШАГ 1: СТРУКТУРА РЕПОЗИТОРИЯ =========="
        pwd
        echo "--- Все файлы ---"
        find . -type f -name "*.py" | sort
        echo ""
        echo "--- Содержимое корня ---"
        ls -la
        echo ""
        
        echo "========== ШАГ 2: АНАЛИЗ footer_test.py =========="
        if [ -f "footer_test.py" ]; then
          echo "✅ Файл существует"
          echo "Размер: $(wc -l < footer_test.py) строк"
          echo ""
          echo "--- Первые 30 строк файла ---"
          head -30 footer_test.py
          echo ""
          echo "--- Поиск test_ функций в файле ---"
          grep -n "def test_" footer_test.py || echo "❌ Нет функций, начинающихся с 'def test_'"
          echo ""
          echo "--- Поиск классов Test ---"
          grep -n "class.*Test" footer_test.py || echo "❌ Нет классов с 'Test'"
          echo ""
          echo "--- Проверка синтаксиса Python ---"
          python3 -m py_compile footer_test.py && echo "✅ Синтаксис OK" || echo "❌ Синтаксическая ошибка"
        else
          echo "❌ Файл footer_test.py НЕ НАЙДЕН в корне!"
          echo "Поиск по всему проекту:"
          find . -name "*footer*" -type f
        fi

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install pytest
      run: |
        pip install pytest
        echo "Версия pytest: $(pytest --version)"

    - name: DEBUG PYTEST COLLECTION
      run: |
        echo "========== ШАГ 3: ДИАГНОСТИКА PYTEST =========="
        echo ""
        echo "--- Способ 1: Базовая коллекция ---"
        python -m pytest footer_test.py --collect-only 2>&1 || true
        
        echo ""
        echo "--- Способ 2: Подробная коллекция ---"
        python -m pytest footer_test.py --collect-only -v 2>&1 || true
        
        echo ""
        echo "--- Способ 3: Запуск с максимальной отладкой ---"
        python -m pytest footer_test.py -v --tb=long --capture=no 2>&1 || true
        
        echo ""
        echo "--- Способ 4: Проверка как модуль ---"
        python -c "
        import sys
        print('Python path:', sys.path)
try:
    import footer_test
    print('✅ Модуль footer_test импортирован успешно')
    # Проверим атрибуты модуля
    print('Атрибуты модуля:', [x for x in dir(footer_test) if not x.startswith('_')])
except Exception as e:
    print(f'❌ Ошибка импорта: {e}')
        "    
      - name: EXECUTE FILE DIRECTLY
      run: |
        echo "========== ШАГ 4: ПРЯМОЙ ЗАПУСК ФАЙЛА =========="
        echo "--- Попытка выполнить файл напрямую ---"
        python footer_test.py 2>&1 || echo "Файл выполнен (или упал с ошибкой)"